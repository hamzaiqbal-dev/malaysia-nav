  <rect width="108" height="108" fill="#0B1220"/>
  <!-- route dots -->
  <path fill="#FFFFFF" d="M30.25,79 a2.75,2.75 0 1,0 5.5,0 a2.75,2.75 0 1,0 -5.5,0 Z M37.65,73.1 a2.75,2.75 0 1,0 5.5,0 a2.75,2.75 0 1,0 -5.5,0 Z M46.55,69.5 a2.75,2.75 0 1,0 5.5,0 a2.75,2.75 0 1,0 -5.5,0 Z"/>
  <!-- landing mark -->
  <path fill="#FFC43D" d="M49,77 a11,3.5 0 1,0 22,0 a11,3.5 0 1,0 -22,0 Z"/>
